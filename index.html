<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top left, #6366f1, transparent 35%),
                radial-gradient(circle at bottom right, #8b5cf6, transparent 35%),
                #0f172a;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            padding: 35px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 24px;
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(99,102,241,.4);
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbd5e1;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            padding: 4px;
            margin-bottom: 25px;
            border-radius: 12px;
            background: rgba(255,255,255,.08);
        }

        .tab {
            width: 50%;
            padding: 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        .tab.active {
            background: white;
            color: #4f46e5;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 15px;
            transition: .25s;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #818cf8;
            background: rgba(255,255,255,.12);
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #94a3b8;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99,102,241,.35);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #fb7185;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
        }

        .developer {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,.1);
            text-align: center;
        }

        .developer span {
            display: block;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 11px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .socials a {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255,255,255,.07);
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            transition: .2s;
        }

        .socials a:hover {
            background: rgba(255,255,255,.15);
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="logo">A</div>

        <h1>Welcome</h1>

        <p class="subtitle">
            Sign in to your account or create a new one
        </p>

        <div class="tabs">
            <button class="tab active" id="loginTab" type="button">
                Login
            </button>

            <button class="tab" id="signupTab" type="button">
                Sign Up
            </button>
        </div>

        <form id="loginForm" class="form active">
            <div class="input-group">
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('loginPassword', this)"
                >
                    Show
                </button>
            </div>

            <button class="submit-btn" id="loginButton" type="submit">
                Login
            </button>

            <p id="loginMessage" class="message"></p>
        </form>

        <form id="signupForm" class="form">
            <div class="input-group">
                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('signupPassword', this)"
                >
                    Show
                </button>
            </div>

            <button class="submit-btn" id="signupButton" type="submit">
                Create Account
            </button>

            <p id="signupMessage" class="message"></p>
        </form>

        <p class="footer">
            Your account information is securely handled by the server.
        </p>

        <div class="developer">
            <span>Contact Developer</span>

            <div class="socials">
                <a href="https://t.me/mdafkarahmad" target="_blank" title="Telegram">
                    ✈
                </a>

                <a href="https://wa.me/9395737512" target="_blank" title="WhatsApp">
                    ☎
                </a>

                <a href="https://instagram.com/mdafkarahmad" target="_blank" title="Instagram">
                    ◎
                </a>

                <a href="https://github.com/mdafkarahmad" target="_blank" title="GitHub">
                    ◉
                </a>
            </div>
        </div>

    </div>
</div>

<script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    loginTab.addEventListener("click", () => {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginForm.classList.add("active");
        signupForm.classList.remove("active");
    });

    signupTab.addEventListener("click", () => {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupForm.classList.add("active");
        loginForm.classList.remove("active");
    });

    function togglePassword(id, button) {
        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }

    signupForm.addEventListener("submit", async e => {
        e.preventDefault();

        const username = document.getElementById("signupUsername").value;
        const password = document.getElementById("signupPassword").value;
        const message = document.getElementById("signupMessage");
        const button = document.getElementById("signupButton");

        button.disabled = true;
        button.textContent = "Creating...";
        message.textContent = "";
        message.className = "message";

        try {
            const response = await fetch(
                "https://loginsystem-ferj.onrender.com/signup",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                }
            );

            const data = await response.json();

            message.textContent = data.message;
            message.classList.add(response.ok ? "success" : "error");

            if (response.ok) {
                signupForm.reset();
            }
        } catch {
            message.textContent = "Unable to connect to server.";
            message.classList.add("error");
        }

        button.disabled = false;
        button.textContent = "Create Account";
    });

    loginForm.addEventListener("submit", async e => {
        e.preventDefault();

        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        const message = document.getElementById("loginMessage");
        const button = document.getElementById("loginButton");

        button.disabled = true;
        button.textContent = "Logging in...";
        message.textContent = "";
        message.className = "message";

        try {
            const response = await fetch(
                "https://loginsystem-ferj.onrender.com/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                }
            );

            const data = await response.json();

            message.textContent = data.message;
            message.classList.add(response.ok ? "success" : "error");

            if (response.ok) {
                console.log("Logged in user:", data.username);
            }
        } catch {
            message.textContent = "Unable to connect to server.";
            message.classList.add("error");
        }

        button.disabled = false;
        button.textContent = "Login";
    });
</script>

</body>
</html>
